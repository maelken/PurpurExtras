name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew shadowJar --no-daemon

      - name: Publish plugin JAR
        if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/PurpurExtras-*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "expected exactly one plugin jar, found ${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          jar_path="${jars[0]}"
          jar_name="$(basename "$jar_path")"
          case "$jar_name" in
            *.jar) ;;
            *)
              echo "refusing to publish ${jar_name}; expected a .jar file" >&2
              exit 1
              ;;
          esac

          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi
          gh release create latest "$jar_path" \
            --target "${GITHUB_SHA}" \
            --title "Latest build" \
            --notes "PurpurExtras plugin jar built from ${GITHUB_SHA}."

          {
            echo "### Plugin jar"
            echo "[${jar_name}](https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/${jar_name})"
          } >> "$GITHUB_STEP_SUMMARY"
